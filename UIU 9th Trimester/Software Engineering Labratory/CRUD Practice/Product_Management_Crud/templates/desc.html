<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Descending</title>
  </head>
  <body>
    <table border="3">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
      </tr>
      {% for product in products %}
      <tr>
        <td>{{product["id"]}}</td>
        <td>{{product["name"]}}</td>
        <td>{{product["category"]}}</td>
        <td>{{product["price"]}}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
