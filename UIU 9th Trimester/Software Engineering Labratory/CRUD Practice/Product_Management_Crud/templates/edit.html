<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Edit Data</h1>
    <form method="POST">
      Name: <input type="text" name="name" value="{{product ['name']}}" id="" />
      <br /><br />
      Category:
      <input type="text" name="category" value="{{product ['category']}}" />
      <br /><br />
      Price:
      <input
        type="number"
        name="price"
        step="any"
        value="{{product ['price']}}"
        id=""
      />
      <br /><br />
      <button type="submit">Submit Edit</button>
    </form>
  </body>
</html>
